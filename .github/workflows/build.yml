name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Java (necesario para compilar Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias
        run: npm install

      - name: Reconstruir la carpeta www/ a partir de los archivos sueltos
        run: |
          mkdir -p www
          cp index.html app.jsx icon.png manifest.json www/

      - name: Reconstruir la carpeta resources/ (para el ícono de la app)
        run: |
          mkdir -p resources
          cp icon.png resources/icon.png
          cp icon.png resources/splash.png
